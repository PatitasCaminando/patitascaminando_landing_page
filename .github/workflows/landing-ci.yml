name: Landing CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-component-coverage:
    name: Unit, Component and Coverage
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: https://patitascaminando-api.onrender.com
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Run unit/component tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
